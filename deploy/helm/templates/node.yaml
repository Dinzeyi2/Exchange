apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: reference
          image: {{ .Values.image | quote }}
          ports: [{name: local-api, containerPort: 8000}]
          env: [{name: EXCHANGE_MODE, value: demo}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "4", memory: 8Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: local-api}
          livenessProbe:
            httpGet: {path: /api/health, port: local-api}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}}
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{name: local-api, port: 8000, targetPort: local-api}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-isolation}
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {exchange-local-ui-client: "true"}}}]
      ports: [{protocol: TCP, port: 8000}]
  egress: []
