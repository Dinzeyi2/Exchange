apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}, exchange-role: {{ .Values.role }}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: exchange
          image: {{ .Values.image | quote }}
          ports: [{name: peer, containerPort: 8443}, {name: local-api, containerPort: 8080}]
          envFrom:
            - secretRef: {name: {{ .Values.runtimeSecret }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 8Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: local-api}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/health, port: local-api}
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}
        - name: config
          secret: {secretName: {{ .Values.configSecret }}, defaultMode: 0440}
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-peers}
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{name: peer, port: 8443, targetPort: peer}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-local}
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{name: local-api, port: 8080, targetPort: local-api}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-isolation}
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- range .Values.peerCidrs }}
    - from: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 8443}]
    {{- end }}
    - from: [{podSelector: {matchLabels: {exchange-local-ui-client: "true"}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range .Values.peerCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 8443}]
    {{- end }}
    {{- range .Values.databaseCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
