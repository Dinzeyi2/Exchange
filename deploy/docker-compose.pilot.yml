# Four institution deployment template. Supply approved per-bank configuration and secrets.
# Acceptance fixture provisioning lives in certify/containers.py, not in the node runtime.
networks:
  agent-bank:
    internal: true
  borrower-bank:
    internal: true
  buyer-bank:
    internal: true
  peer-fabric: {}
  seller-bank:
    internal: true
services:
  agent:
    cap_drop:
    - ALL
    command: []
    depends_on:
      agent-db:
        condition: service_healthy
    entrypoint:
    - exchange
    - serve
    - --config
    - /config/node.yaml
    env_file:
    - ${EXCHANGE_CONFIG_ROOT:?Set bank configuration root}/agent/runtime.env
    image: exchange-node:0.2.0
    networks:
    - peer-fabric
    - agent-bank
    ports:
    - 127.0.0.1:18082:8080
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    volumes:
    - ${EXCHANGE_CONFIG_ROOT:?Set bank configuration root}/agent:/config:ro
    - agent-data:/data
  agent-db:
    env_file:
    - ${EXCHANGE_CONFIG_ROOT:?Set bank configuration root}/agent/database.env
    healthcheck:
      interval: 3s
      retries: 30
      test:
      - CMD-SHELL
      - pg_isready -U exchange -d exchange
      timeout: 3s
    image: postgres:16-bookworm
    networks:
    - agent-bank
    volumes:
    - agent-postgres:/var/lib/postgresql/data
  borrower:
    cap_drop:
    - ALL
    command: []
    depends_on:
      borrower-db:
        condition: service_healthy
    entrypoint:
    - exchange
    - serve
    - --config
    - /config/node.yaml
    env_file:
    - ${EXCHANGE_CONFIG_ROOT:?Set bank configuration root}/borrower/runtime.env
