    ports:
    - 127.0.0.1:18081:8080
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    volumes:
    - ${EXCHANGE_CONFIG_ROOT:?Set bank configuration root}/buyer:/config:ro
    - buyer-data:/data
  buyer-db:
    env_file:
    - ${EXCHANGE_CONFIG_ROOT:?Set bank configuration root}/buyer/database.env
