    ports:
    - 127.0.0.1:18083:8080
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    volumes:
    - ${EXCHANGE_CONFIG_ROOT:?Set bank configuration root}/borrower:/config:ro
    - borrower-data:/data
  borrower-db:
    env_file:
    - ${EXCHANGE_CONFIG_ROOT:?Set bank configuration root}/borrower/database.env
    healthcheck:
      interval: 3s
      retries: 30
      test:
      - CMD-SHELL
      - pg_isready -U exchange -d exchange
      timeout: 3s
    image: postgres:16-bookworm
    networks:
    - borrower-bank
    volumes:
    - borrower-postgres:/var/lib/postgresql/data
  buyer:
    cap_drop:
    - ALL
    command: []
    depends_on:
      buyer-db:
        condition: service_healthy
    entrypoint:
    - exchange
