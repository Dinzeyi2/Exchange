name: Distributed node checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --frozen --extra test
      - run: uv run --frozen pytest -q
      - run: npm --prefix ui ci --no-audit --no-fund
      - run: npm --prefix ui run build
      - run: docker build -f deploy/four-node/Dockerfile -t exchange-node:distributed .
      - run: uv run --frozen exchange certify --deployment containers --acceptance --output .local/certification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-acceptance-evidence
          path: |
            .local/certification/report.json
            .local/certification/report.pdf
            .local/certification/report.pdf.sig.json
